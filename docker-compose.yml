version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: dispatch_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dispatch_portal
    volumes:
      - mongo_data:/data/db
    networks:
      - dispatch_net

  redis:
    image: redis:7.2-alpine
    container_name: dispatch_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - dispatch_net

volumes:
  mongo_data:
  redis_data:

networks:
  dispatch_net:
    driver: bridge
